name: windows-check
on:
  push:
    branches: [ci]
jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: install
        shell: pwsh
        run: |
          pip install playwright==1.55.0
          python -m playwright install firefox
          [System.Environment]::OSVersion.VersionString
      - name: unzip (Expand-Archive) and names
        shell: pwsh
        run: |
          $z = Get-ChildItem check -Filter *.zip | Select-Object -First 1
          "ZIP name: $($z.Name)"
          $z.Name | Out-File -Encoding utf8 out-zipname.txt
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $z.FullName "$env:USERPROFILE\Downloads\$($z.Name)"
          Expand-Archive -Path "$env:USERPROFILE\Downloads\$($z.Name)" -DestinationPath "$env:USERPROFILE\Downloads\x" -Force
          Get-ChildItem -Recurse "$env:USERPROFILE\Downloads\x" | ForEach-Object { $_.FullName } | Tee-Object -FilePath out\files.txt
          Get-FileHash -Algorithm SHA256 (Get-ChildItem -Recurse -File "$env:USERPROFILE\Downloads\x") | Format-Table -AutoSize | Out-String -Width 300 | Tee-Object -FilePath out\hashes.txt
      - name: double-click (MOTW + ShellExecute)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          powershell -ExecutionPolicy Bypass -File check/dblclick.ps1
      - name: audio control test (no device)
        shell: pwsh
        run: |
          Get-Service Audiosrv, AudioEndpointBuilder | Format-Table Name, Status, StartType
          Get-CimInstance Win32_SoundDevice | Format-Table Name, Status
          python -X utf8 check/actest.py check/actest.html before-device
      - name: virtual audio device (Scream)
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 4
        run: |
          Set-Service Audiosrv -StartupType Automatic; Set-Service AudioEndpointBuilder -StartupType Automatic
          Start-Service AudioEndpointBuilder; Start-Service Audiosrv
          Invoke-WebRequest https://github.com/duncanthrax/scream/releases/download/4.0/Scream4.0.zip -OutFile scream.zip
          Expand-Archive scream.zip scream -Force
          Get-ChildItem -Recurse scream | Where-Object { $_.Name -match 'inf$|cat$|devcon|bat$' } | ForEach-Object { $_.FullName }
          $cat = Get-ChildItem -Recurse scream -Filter *.cat | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          $inf = Get-ChildItem $cat.DirectoryName -Filter *.inf | Select-Object -First 1
          $cert = (Get-AuthenticodeSignature $cat.FullName).SignerCertificate
          $st = New-Object System.Security.Cryptography.X509Certificates.X509Store 'TrustedPublisher','LocalMachine'; $st.Open('ReadWrite'); $st.Add($cert); $st.Close()
          $dev = Get-ChildItem -Recurse scream -Filter devcon*x64*.exe | Select-Object -First 1
          & $dev.FullName install $inf.FullName '*Scream'
          Start-Sleep 5
          Restart-Service Audiosrv -Force
          Get-CimInstance Win32_SoundDevice | Format-Table Name, Status
          python -X utf8 check/actest.py check/actest.html after-device
      - name: browsers
        shell: pwsh
        run: |
          $idx = "$env:USERPROFILE\Downloads\x\bid-window-404\index.html"
          $F = ([System.Uri]$idx).AbsoluteUri
          $W = 'https://kangraemin.github.io/bid-window-404/'
          "file url: $F"
          foreach ($r in @(@(1366,768),@(1920,1080))) {
            foreach ($br in @(@('chromium','msedge','edge'),@('chromium','chrome','chrome'),@('firefox','','firefox'))) {
              $ch = if ($br[1]) { @('--channel', $br[1]) } else { @() }
              python -X utf8 check/platcheck.py --url $F --engine $br[0] @ch --w $r[0] --h $r[1] --secs 250 --shot 15 --out out --tag "win-$($br[2])-file-$($r[0])"
              python -X utf8 check/platcheck.py --url $W --engine $br[0] @ch --w $r[0] --h $r[1] --secs 40 --shot 20 --out out --tag "win-$($br[2])-web-$($r[0])"
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: win-results, path: out }
