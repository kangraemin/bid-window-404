<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>입찰 창구 404호</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
  html,body{margin:0;height:100%;background:#120e18;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#120e18}
  #fontwarm{position:absolute;left:-999px;top:0;font:12px G11}
  /* 세로 진입 안내: 화면을 눕혀 보여 주므로 처음 한 번 '왼쪽으로 눕혀 주세요' */
  #rot{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(18,14,24,.93);color:#f6eedc;font:16px G11;text-align:center;padding:0 24px}
  #rot[hidden]{display:none}
  #rot b{font-family:G11B;color:#f6c445}
  #rot .s{font-size:13px;color:#7ab4e8;line-height:1.6;margin:0}
  #rot p{margin:0}
  #rot .ph{width:44px;height:76px;border:4px solid #f6eedc;border-radius:2px;box-shadow:0 0 0 4px #1a1424;position:relative;animation:rotph 2.4s steps(1) infinite}
  #rot .ph:after{content:'';position:absolute;left:14px;bottom:4px;width:8px;height:4px;background:#f6c445}
  @keyframes rotph{0%{transform:rotate(0)}40%{transform:rotate(-45deg)}55%{transform:rotate(-90deg)}100%{transform:rotate(-90deg)}}
  #rot button{font:16px G11B;color:#1a1424;background:#f6c445;border:3px solid #1a1424;box-shadow:0 3px 0 #1a1424;padding:12px 22px;min-height:48px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="rot" hidden><div class="ph"></div><p>휴대폰을 <b>왼쪽으로 눕혀</b> 주세요</p><p class="s">게임 화면이 가로로 누워 있어요.<br>눕히면 글자가 똑바로 보여요.</p><button type="button">안내 닫기 (화면은 가로 그대로)</button></div>
<div id="fontwarm"><span style="font-family:G11">가</span><span style="font-family:G11B">가</span><span style="font-family:G9">가</span></div>
<script src="assets/images.js"></script>
<script src="data.js"></script>
<script src="audio/zzfx.js"></script>
<script src="audio/bgm.js" onerror="0"></script>
<script src="audio/audio.js"></script>
<script src="game.js"></script>
</body>
</html>
